name: Flutter Android CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2️. Flutter installieren
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"

      # 3️. Dependencies holen
      - name: Install dependencies
        run: flutter pub get

      # 4️. Analyse
      - name: Analyze project
        run: flutter analyze

      # 5️. Tests
      - name: Run tests
        run: flutter test --coverage

      # 6️. Android Build
      - name: Build APK
        run: flutter build apk --debug
